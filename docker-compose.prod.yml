version: "3.9"

services:
  database:
    image: postgres:16.1-alpine3.18
    container_name: lms-postgres
    restart: always
    ports:
      - ${DB_FORWARD_PORT:-5433}:5432
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_DATABASE:-lms}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lms_network

  redis:
    image: redis:7.2-alpine
    container_name: lms-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - lms_network

  kafka:
    image: apache/kafka:3.9.1
    container_name: lms-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  file-system:
    container_name: file-system
    build:
      context: ./apps/file-system
      dockerfile: Dockerfile
    env_file:
      - ./apps/file-system/.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/file-system:/app
      - /app/node_modules
    restart: on-failure
    tty: true
    stdin_open: true
    networks:
      - lms_network
    depends_on:
      - database            

  lms-backend:
    container_name: lms-backend
    build:
      context: .
      dockerfile: ./apps/lms-backend/Dockerfile
    env_file:
      - ./apps/lms-backend/.env.example
    ports:
      - "8080:8080"
    volumes:
      - ./apps/lms-backend:/app
      - /app/node_modules
    restart: on-failure
    tty: true
    stdin_open: true
    networks:
      - lms_network
    depends_on:
      - database
      - redis

  single-sign-on:
    container_name: single-sign-on
    build:
      context: .
      dockerfile: ./apps/single-sign-on/Dockerfile
    env_file:
      - ./apps/single-sign-on/.env.example
    ports:
      - "5555:5555"
    volumes:
      - ./apps/single-sign-on:/app
      - /app/node_modules
    restart: on-failure
    tty: true
    stdin_open: true
    networks:
      - lms_network
    depends_on:
      - database
      - redis

  lms-frontend:
    container_name: lms-frontend
    build:
      context: .
      dockerfile: ./apps/lms-frontend/Dockerfile
    env_file:
      - ./apps/lms-frontend/.env.example      
    restart: always
    ports:
      - 3000:3000
    networks:
      - lms_network
  websocket:
    container_name: websocket
    build:
      context: .
      dockerfile: ./apps/websocket/Dockerfile
    env_file:
      - ./apps/websocket/.env.example     
    restart: always
    ports:
      - 8083:8083
    networks:
      - lms_network
    depends_on:
      - redis   

networks:
  lms_network:
    name: lms-shared-network
    external: true

volumes:
  pg_data: {}
  pgadmin_data: {}
  redis_data: {}
  kafka_data: {}
